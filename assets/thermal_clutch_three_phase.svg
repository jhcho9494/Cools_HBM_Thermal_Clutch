<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <style>
    .t{font-family:Arial,sans-serif;fill:#14213d}.h{font-size:32px;font-weight:700}.s{font-size:21px}.b{font-size:24px;font-weight:700}
    .box{fill:#f5f7fa;stroke:#546a7b;stroke-width:2}.hot{fill:#ef8354}.cool{fill:#5bc0eb}.aln{fill:#f6bd60}.stack{fill:#7d8597}
    .arrow{stroke:#14213d;stroke-width:5;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#14213d"/></marker></defs>
  <text x="750" y="45" text-anchor="middle" class="t h">HBM Thermal Clutch — Three-Phase Heat Transfer</text>

  <g transform="translate(40,90)">
    <rect x="0" y="0" width="420" height="450" rx="18" class="box"/>
    <text x="210" y="42" text-anchor="middle" class="t b">1. Heating / Standby</text>
    <rect x="95" y="85" width="230" height="65" class="cool"/>
    <text x="210" y="125" text-anchor="middle" class="t s">Heat-dump manifold</text>
    <rect x="125" y="160" width="170" height="55" class="aln"/>
    <text x="210" y="195" text-anchor="middle" class="t s">AlN shuttle</text>
    <line x1="125" y1="235" x2="295" y2="235" stroke="#14213d" stroke-dasharray="8,8" stroke-width="3"/>
    <text x="210" y="265" text-anchor="middle" class="t s">~100 µm vacuum gap</text>
    <rect x="105" y="285" width="210" height="55" class="hot"/>
    <text x="210" y="320" text-anchor="middle" class="t s">Heater ON</text>
    <rect x="75" y="355" width="270" height="20" class="stack"/>
    <rect x="75" y="382" width="270" height="20" class="stack"/>
    <rect x="75" y="409" width="270" height="20" class="stack"/>
  </g>

  <line x1="480" y1="315" x2="535" y2="315" class="arrow"/>

  <g transform="translate(540,90)">
    <rect x="0" y="0" width="420" height="450" rx="18" class="box"/>
    <text x="210" y="42" text-anchor="middle" class="t b">2. Cooling Pickup</text>
    <rect x="95" y="85" width="230" height="65" class="cool"/>
    <text x="210" y="125" text-anchor="middle" class="t s">Pressure space</text>
    <rect x="125" y="210" width="170" height="55" class="aln"/>
    <text x="210" y="245" text-anchor="middle" class="t s">AlN shuttle</text>
    <rect x="105" y="265" width="210" height="55" class="hot"/>
    <text x="210" y="300" text-anchor="middle" class="t s">Heater OFF</text>
    <line x1="210" y1="185" x2="210" y2="205" class="arrow"/>
    <text x="210" y="175" text-anchor="middle" class="t s">Positive pressure</text>
    <rect x="75" y="355" width="270" height="20" class="stack"/>
    <rect x="75" y="382" width="270" height="20" class="stack"/>
    <rect x="75" y="409" width="270" height="20" class="stack"/>
    <text x="210" y="445" text-anchor="middle" class="t s">0.5 s direct solid heat pickup</text>
  </g>

  <line x1="980" y1="315" x2="1035" y2="315" class="arrow"/>

  <g transform="translate(1040,90)">
    <rect x="0" y="0" width="420" height="450" rx="18" class="box"/>
    <text x="210" y="42" text-anchor="middle" class="t b">3. Hidden Heat Dump</text>
    <rect x="95" y="85" width="230" height="65" class="cool"/>
    <text x="210" y="125" text-anchor="middle" class="t s">Heat-dump manifold</text>
    <rect x="125" y="150" width="170" height="55" class="aln"/>
    <text x="210" y="185" text-anchor="middle" class="t s">Heated AlN shuttle</text>
    <line x1="210" y1="215" x2="210" y2="255" class="arrow"/>
    <text x="210" y="285" text-anchor="middle" class="t s">Heat released in parallel</text>
    <rect x="105" y="310" width="210" height="55" class="hot"/>
    <text x="210" y="345" text-anchor="middle" class="t s">Heater ready</text>
    <text x="210" y="405" text-anchor="middle" class="t s">Next die pick and alignment</text>
    <text x="210" y="438" text-anchor="middle" class="t b">0 s added to takt</text>
  </g>
</svg>
