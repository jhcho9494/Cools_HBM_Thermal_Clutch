<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><style>.t{font-family:Arial,sans-serif;fill:#14213d}.h{font-size:36px;font-weight:700}.s{font-size:25px}.b{font-size:30px;font-weight:700}.box{fill:#f7f9fc;stroke:#516579;stroke-width:3}.hot{fill:#ef8354}.cool{fill:#5bc0eb}.aln{fill:#f6bd60}.stack{fill:#7d8597}.air{stroke:#8ecae6;stroke-width:7;fill:none;stroke-dasharray:14,10}.heat{stroke:#d62828;stroke-width:8;fill:none;marker-end:url(#m)}.arr{stroke:#14213d;stroke-width:5;marker-end:url(#m2)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#d62828"/></marker><marker id="m2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#14213d"/></marker></defs><text x="700" y="52" text-anchor="middle" class="t h">HBM TCB Cooling Paradigm Shift</text><g transform="translate(55,100)"><rect width="590" height="540" rx="22" class="box"/><text x="295" y="48" text-anchor="middle" class="t b">Conventional: Air-Jet Convection</text><rect x="210" y="310" width="170" height="65" class="hot"/><text x="295" y="350" text-anchor="middle" class="t s">Heater ~300°C</text><rect x="160" y="390" width="270" height="22" class="stack"/><rect x="160" y="420" width="270" height="22" class="stack"/><rect x="160" y="450" width="270" height="22" class="stack"/><path d="M120 175 C150 220,150 260,190 300" class="air"/><path d="M470 175 C440 220,440 260,400 300" class="air"/><text x="295" y="150" text-anchor="middle" class="t s">Non-contact air jet</text><text x="295" y="505" text-anchor="middle" class="t b">Cooling ~4 s</text><text x="295" y="535" text-anchor="middle" class="t s">Low conductance · cumulative heat</text></g><line x1="665" y1="370" x2="735" y2="370" class="arr"/><g transform="translate(755,100)"><rect width="590" height="540" rx="22" class="box"/><text x="295" y="48" text-anchor="middle" class="t b">Cools: Direct Solid Conduction</text><rect x="180" y="100" width="230" height="70" class="cool"/><text x="295" y="143" text-anchor="middle" class="t s">Heat-dump manifold</text><rect x="205" y="205" width="180" height="70" class="aln"/><text x="295" y="249" text-anchor="middle" class="t s">AlN shuttle</text><rect x="210" y="285" width="170" height="65" class="hot"/><text x="295" y="325" text-anchor="middle" class="t s">Heater ~300°C</text><rect x="160" y="390" width="270" height="22" class="stack"/><rect x="160" y="420" width="270" height="22" class="stack"/><rect x="160" y="450" width="270" height="22" class="stack"/><path d="M295 350 L295 280" class="heat"/><text x="295" y="505" text-anchor="middle" class="t b">Heat pickup ~0.5 s</text><text x="295" y="535" text-anchor="middle" class="t s">Full-area pressed solid contact</text></g><text x="700" y="690" text-anchor="middle" class="t b">Not a stronger air jet—a different physical path for heat removal.</text></svg>