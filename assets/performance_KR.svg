<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><style>.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#14213d}.h{font-size:36px;font-weight:700}.b{font-size:30px;font-weight:700}.s{font-size:24px}.box{fill:#f7f9fc;stroke:#516579;stroke-width:3}.base{fill:#bfc7d5}.cools{fill:#4ea8de}.accent{fill:#ef8354}</style><text x="700" y="52" text-anchor="middle" class="t h">HBM 서멀클러치 대표 성능</text><g transform="translate(60,100)"><rect width="600" height="520" rx="22" class="box"/><text x="300" y="48" text-anchor="middle" class="t b">냉각시간 300→150℃</text><rect x="120" y="170" width="130" height="250" class="base"/><rect x="350" y="389" width="130" height="31" class="cools"/><text x="185" y="150" text-anchor="middle" class="t b">4.0초</text><text x="415" y="370" text-anchor="middle" class="t b">0.5초</text><text x="185" y="455" text-anchor="middle" class="t s">종래 TCB</text><text x="415" y="455" text-anchor="middle" class="t s">서멀클러치</text><text x="300" y="500" text-anchor="middle" class="t b">8분의 1</text></g><g transform="translate(740,100)"><rect width="600" height="520" rx="22" class="box"/><text x="300" y="48" text-anchor="middle" class="t b">12단 누적 등가 열노출량</text><rect x="120" y="170" width="130" height="250" class="base"/><rect x="350" y="383" width="130" height="37" class="accent"/><text x="185" y="150" text-anchor="middle" class="t b">기준 100</text><text x="415" y="365" text-anchor="middle" class="t b">약 15</text><text x="185" y="455" text-anchor="middle" class="t s">종래 TCB</text><text x="415" y="455" text-anchor="middle" class="t s">서멀클러치</text><text x="300" y="500" text-anchor="middle" class="t b">약 85% 저감</text></g><text x="700" y="665" text-anchor="middle" class="t b">열덤프는 다음 다이 취출·정렬 중 수행 — 실효 택트 가산 0</text></svg>