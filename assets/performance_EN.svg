<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><style>.t{font-family:Arial,sans-serif;fill:#14213d}.h{font-size:36px;font-weight:700}.b{font-size:30px;font-weight:700}.s{font-size:24px}.box{fill:#f7f9fc;stroke:#516579;stroke-width:3}.base{fill:#bfc7d5}.cools{fill:#4ea8de}.accent{fill:#ef8354}</style><text x="700" y="52" text-anchor="middle" class="t h">Representative HBM Thermal Clutch Performance</text><g transform="translate(60,100)"><rect width="600" height="520" rx="22" class="box"/><text x="300" y="48" text-anchor="middle" class="t b">Cooling Time: 300→150°C</text><rect x="120" y="170" width="130" height="250" class="base"/><rect x="350" y="389" width="130" height="31" class="cools"/><text x="185" y="150" text-anchor="middle" class="t b">4.0 s</text><text x="415" y="370" text-anchor="middle" class="t b">0.5 s</text><text x="185" y="455" text-anchor="middle" class="t s">Conventional TCB</text><text x="415" y="455" text-anchor="middle" class="t s">Thermal Clutch</text><text x="300" y="500" text-anchor="middle" class="t b">1/8 of baseline</text></g><g transform="translate(740,100)"><rect width="600" height="520" rx="22" class="box"/><text x="300" y="48" text-anchor="middle" class="t b">12-Layer Cumulative Thermal Exposure</text><rect x="120" y="170" width="130" height="250" class="base"/><rect x="350" y="383" width="130" height="37" class="accent"/><text x="185" y="150" text-anchor="middle" class="t b">Baseline 100</text><text x="415" y="365" text-anchor="middle" class="t b">~15</text><text x="185" y="455" text-anchor="middle" class="t s">Conventional TCB</text><text x="415" y="455" text-anchor="middle" class="t s">Thermal Clutch</text><text x="300" y="500" text-anchor="middle" class="t b">~85% lower</text></g><text x="700" y="665" text-anchor="middle" class="t b">Heat dump runs during next-die pick and alignment — 0 s added to effective takt</text></svg>